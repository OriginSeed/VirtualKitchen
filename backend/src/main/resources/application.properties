# Default model per capability
# Default model per capability when the caller doesn't specify one. Set AI_TEXT_DEFAULT_MODEL to switch text
# generation between gemini-flash, ollama-qwen and deepinfra-deepseek-v4-flash (the model must be enabled).
# AI_IMAGE_DEFAULT_MODEL switches images between gemini-image, drawthings-sdxl and deepinfra-flux2-klein,
# independently of the text model.
ai.default-model.TEXT_TO_TEXT=${AI_TEXT_DEFAULT_MODEL:deepinfra-deepseek-v4-flash}
ai.default-model.TEXT_TO_IMAGE=${AI_IMAGE_DEFAULT_MODEL:deepinfra-flux2-klein}
ai.default-model.TEXT_TO_SPEECH=${AI_TTS_DEFAULT_MODEL:gemini-tts}

# Admin runtime config
# Admin runtime config: the Keys section (replace provider API keys / Resend API key from the admin panel).
# Temporary, for admin testing. Needs VK_CONFIG_ENC_KEY (any passphrase) so keys are stored encrypted.
vk.admin.secret-editing.enabled=${VK_ADMIN_SECRET_EDITING:false}
