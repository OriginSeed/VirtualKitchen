# Application
spring.application.name=OriginSeed

# Secrets and environment-specific values come ONLY from environment variables (see "Configuration" in
# backend/README.md). For local development they can live in a git-ignored .env file in properties format, read
# from backend/ or the repo root, whichever is the working directory. Real environment variables win over .env.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# GridFS bucket backing artifact binary payloads (collections ai_artifacts.files / .chunks).
spring.data.mongodb.gridfs.bucket=ai_artifacts

# Security: JWT, Google sign-in, admins
# JWT signing secret, at least 32 characters (startup fails otherwise).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

google.oauth.client-id=${GOOGLE_CLIENT_ID}

# Verified users with these emails (comma-separated) become ADMIN the next time they sign in; nobody is demoted.
vk.admin.emails=${VK_ADMIN_EMAILS:}

# OTP and mail
app.otp.expiration-minutes= 10
app.otp.max-attempts=5
app.otp.resend-window-minutes=15
app.otp.max-per-window=5

# OTP/verification/reset emails are sent through Resend (https://resend.com). The sender's domain must be verified
# in Resend, e.g. MAIL_FROM=Virtual Kitchen <no-reply@your-domain>. Without RESEND_API_KEY the app starts, but every
# email fails with 502 and logs event=email_send_failed reason=NOT_CONFIGURED.
app.mail.from=${MAIL_FROM}
app.mail.resend.api-key=${RESEND_API_KEY:}
app.mail.resend.base-url=${RESEND_BASE_URL:https://api.resend.com}
app.mail.resend.timeout-ms=${RESEND_TIMEOUT_MS:10000}

# Swagger / API docs: off unless SWAGGER_ENABLED=true (local development only, never production).
app.swagger.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${app.swagger.enabled}
springdoc.swagger-ui.enabled=${app.swagger.enabled}
springdoc.swagger-ui.path=/ui

# CORS: comma-separated frontend origins allowed to call the API. Set the real domain in production; "*" is refused.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Request rate limits per client (RateLimitFilter; see CONFIGURATION.md). In memory: per backend instance.
app.ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
# true only behind a reverse proxy that sets X-Forwarded-For; otherwise clients could choose their own key.
app.ratelimit.trust-forwarded=${RATE_LIMIT_TRUST_FORWARDED:false}
app.ratelimit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:20}
app.ratelimit.ai-start-per-minute=10
app.ratelimit.general-per-minute=300

# Largest accepted request body (RequestSizeLimitFilter): 5 MB.
app.http.max-body-bytes=5242880

# Error responses never carry stack traces or exception messages (GlobalExceptionHandler writes the user-facing text).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# Logging
# Logging to see connection details
logging.level.org.mongodb.driver.connection=INFO
logging.level.org.mongodb.driver.cluster=INFO

# HTTP requests at least this slow are also written to application.log (all requests go to logs/access.log).
app.logging.slow-request-ms=${SLOW_REQUEST_MS:3000}

# File storage (Supabase)
supabase.url=${SUPABASE_URL}
supabase.service-key=${SUPABASE_SERVICE_KEY}
supabase.bucket=recipe-images
supabase.timeout-ms=30000

# Task pools, threads, queues and scheduled jobs
# Sized for about 10-50 concurrent users. Raise or lower them to match your AI providers' rate limits: the image pool
# is how many images are drawn at once, the orchestrator pools how many whole jobs run at once.
app.taskpool.visualization.n-threads=${VISUALIZATION_THREADS:8}
app.taskpool.orchestrator.n-threads=${VISUALIZATION_ORCHESTRATOR_THREADS:6}
app.taskpool.flow-generation-orchestrator.n-threads=${GENERATION_ORCHESTRATOR_THREADS:4}
# Step-image fixes run on their own pool so a one-image fix never waits behind whole-recipe jobs.
app.taskpool.step-fix.n-threads=${STEP_FIX_THREADS:2}

# Bounded pool for text-to-text AI calls (recipe generation / chat), previously unbounded.
app.taskpool.ai-text.n-threads=${AI_TEXT_THREADS:4}

# Background AI jobs (generation, visualization, storyboard, step fix): at most this many queued or running per user,
# and at most this many waiting system-wide; beyond either, a new job is refused with a friendly 429 "busy".
app.jobs.max-active-per-user=${AI_JOBS_MAX_ACTIVE_PER_USER:10}
app.jobs.max-queued=${AI_JOBS_MAX_QUEUED:60}

# Admission-control depth caps (queued+processing jobs) per capability's pool.
app.queue.ai-text-max-depth=20
app.queue.ai-image-max-depth=30

# StaleJobReconciler: fails generation/visualization jobs not written for this long (a live job
# touches updatedAt on every stage/step), and AI requests stuck PROCESSING (releasing their credits).
# Both sit well above every AI call timeout below.
app.jobs.stale-after-ms=900000
# A QUEUED job only waits for a free thread, so it gets longer before it counts as abandoned.
app.jobs.queued-stale-after-ms=3600000
app.jobs.ai-request-stale-after-ms=3600000
app.jobs.reconciler.fixed-delay-ms=300000

# Two scheduled jobs now exist (credit cycle reset, artifact recovery); give them their own threads
# so a slow sweep cannot delay the nightly credit reset.
spring.task.scheduling.pool.size=2

app.queue.ai-tts-max-depth=${AI_TTS_MAX_DEPTH:20}

app.taskpool.narration.n-threads=${NARRATION_THREADS:4}

# Admin global-asset (ingredient/equipment) image generation runs on its own pool so bulk runs never starve recipe visuals.
app.taskpool.global-asset.n-threads=${GLOBAL_ASSET_THREADS:2}

# AI request timeouts, retries and credits
# Per-capability job timeout and transient-failure retry policy.
ai.request.timeout-ms.TEXT_TO_TEXT=250000
ai.request.timeout-ms.TEXT_TO_IMAGE=450000
ai.request.max-retries=1
ai.request.retry-backoff-ms=500

# USD -> INR rate for showing request cost in INR in logs only (DB stores USD). Update when the rate moves.
ai.request.usd-to-inr=94.0

# Monthly AI credit allocation per user, and the daily sweep that resets expired cycles.
ai.credits.default-monthly-allocation=50
ai.credits.cycle-reset-cron=0 0 2 * * *

# ====================================================================================================
# AI artifact store
# ====================================================================================================
# AI artifact store: keeps a paid AI payload durable between the provider call that produced it
# and the dependent work that consumes it (e.g. the Supabase upload), so a failure in that work
# never costs a second generation. See AI_ARTIFACT_STORE_DESIGN.md.
# Setting this to false restores the previous behaviour without a redeploy.
ai.artifact.enabled=true

# Text/JSON payloads above this size are promoted from the artifact document into GridFS.
ai.artifact.max-inline-bytes=16000

# How long a consumer "owns" an artifact before the recovery sweeper may also try it.
ai.artifact.lease-ttl-ms=120000

# Metadata retention after the payload was consumed / abandoned (TTL index; payload already gone).
# Must stay well above the sweeper interval so the blob GC pass runs before the row expires.
ai.artifact.consumed-retention=7d
ai.artifact.abandoned-retention=30d
# Sweeper that re-runs dependent work for payloads whose consumer never completed â including
# after a crash. It never calls an AI provider, so it can never spend credits.
ai.artifact.sweeper.enabled=true
ai.artifact.sweeper.fixed-delay-ms=300000
ai.artifact.sweeper.initial-delay-ms=60000
ai.artifact.sweeper.orphan-age-ms=120000
ai.artifact.sweeper.batch-size=25
ai.artifact.sweeper.max-recovery-attempts=3

# ====================================================================================================
# AI cost analytics and pricing
# ====================================================================================================
# Rate-card version for the ai.models[n].*-usd-per-million prices. Bump it whenever a price changes, so earlier
# costs keep the rates they were calculated with (a changed price under the same version is ignored, with a warning).
vk.ai.pricing.version=${AI_PRICING_VERSION:v2}

# Optional estimated compute cost of local engines, USD per second of call duration (unset = unavailable), e.g.
#vk.ai.pricing.local-infra-usd-per-second.ollama-qwen=0.0002

# How often failed analytics writes are retried.
vk.ai.analytics.retry-interval-ms=30000

# ====================================================================================================
# Text models (registry entries and provider settings)
# ====================================================================================================
# Model registry: PAID vs OPEN_SOURCE classification, provider bean/model mapping, credit cost,
# and which OPEN_SOURCE model each PAID model automatically falls back to when credits run out.
# providerBean must match one of the @Component("...") bean names in restclient.client.*.
ai.models[0].key=gemini-flash
ai.models[0].capability=TEXT_TO_TEXT
ai.models[0].tier=PAID
ai.models[0].provider-bean=geminiAiClient
ai.models[0].provider-model-id=${ai.gemini.default-model}
ai.models[0].credit-cost=1
# USD per 1M tokens for ${ai.gemini.default-model} (gemini-3.1-flash-lite) — only used to estimate request cost.
# Update together with ai.gemini.default-model. Output price covers thinking tokens too.
ai.models[0].input-usd-per-million=0.25
ai.models[0].output-usd-per-million=1.50
ai.models[0].cached-input-usd-per-million=0.025
ai.models[0].fallback-model-key=ollama-qwen
ai.models[0].enabled=true
ai.models[0].display-name=Gemini Flash
ai.models[0].user-selectable=true

ai.models[1].key=ollama-qwen
ai.models[1].capability=TEXT_TO_TEXT
ai.models[1].tier=OPEN_SOURCE
ai.models[1].provider-bean=ollamaAiClient
ai.models[1].provider-model-id=${ai.ollama.defaultModel}
ai.models[1].credit-cost=0
# Local model: no provider bill.
ai.models[1].input-usd-per-million=0
ai.models[1].output-usd-per-million=0
ai.models[1].enabled=true
ai.models[1].display-name=Qwen (local Ollama)
ai.models[1].user-selectable=false

ai.models[2].key=openai-gpt4o-mini
ai.models[2].capability=TEXT_TO_TEXT
ai.models[2].tier=PAID
ai.models[2].provider-bean=openAiAiClient
ai.models[2].provider-model-id=gpt-4o-mini
ai.models[2].credit-cost=2
ai.models[2].fallback-model-key=ollama-qwen
ai.models[2].enabled=${OPENAI_ENABLED:true}
ai.models[2].display-name=GPT-4o mini
ai.models[2].user-selectable=true
# USD per 1M tokens (OpenAI pricing page, 2026-11): check it and bump vk.ai.pricing.version when changing these.
ai.models[2].input-usd-per-million=0.15
ai.models[2].cached-input-usd-per-million=0.075
ai.models[2].output-usd-per-million=0.60

# --- DeepInfra (OpenAI-compatible) text generation ---
# Off unless DEEPINFRA_ENABLED=true; select it with AI_TEXT_DEFAULT_MODEL=deepinfra-deepseek-v4-flash.
ai.models[7].key=deepinfra-deepseek-v4-flash
ai.models[7].capability=TEXT_TO_TEXT
ai.models[7].tier=PAID
ai.models[7].provider-bean=deepInfraAiClient
ai.models[7].provider-model-id=${ai.deepinfra.defaultModel}
ai.models[7].credit-cost=1
# USD per 1M tokens for DeepSeek V4 Flash, as supplied for this integration (2026-11-01). DeepInfra's catalogue
# page may list different rates: check it and bump vk.ai.pricing.version when changing these.
ai.models[7].input-usd-per-million=0.20
ai.models[7].cached-input-usd-per-million=0.006
ai.models[7].output-usd-per-million=0.60
ai.models[7].fallback-model-key=ollama-qwen
ai.models[7].enabled=${DEEPINFRA_ENABLED:true}
ai.models[7].display-name=DeepSeek V4 Flash
ai.models[7].user-selectable=true
#ai.provider=gemini

ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.base-url=https://generativelanguage.googleapis.com
ai.gemini.chat-endpoint=/v1beta/models/{model}:generateContent
ai.gemini.default-model=gemini-3.1-flash-lite

# Thinking models + full process JSON routinely exceed 30s; 2 attempts (first + validation retry) must fit in ai.request.timeout-ms.TEXT_TO_TEXT.
ai.gemini.timeout-ms=120000

# Explicit context cache for static system prompts (requests with cacheSystemPrompt=true). Storage is billed per
# token-hour while a cache lives; it is recreated lazily on the first request after it expires.
ai.gemini.cache.enabled=true
ai.gemini.cache.ttl-seconds=3600

ai.provider=ollama

ai.ollama.baseUrl=http://localhost:11434
ai.ollama.chatEndpoint=/api/chat
ai.ollama.defaultModel=qwen2.5:7b
ai.ollama.timeoutMs=600000

# DeepInfra Properties (OpenAI-compatible API). The key comes only from the environment; never commit it.
ai.deepinfra.apiKey=${DEEPINFRA_API_KEY:}
ai.deepinfra.baseUrl=https://api.deepinfra.com
ai.deepinfra.chatEndpoint=/v1/openai/chat/completions
ai.deepinfra.defaultModel=${DEEPINFRA_MODEL:deepseek-ai/DeepSeek-V4.1-Flash-1017}
ai.deepinfra.timeoutMs=120000

# Sent as reasoning_effort; "none" keeps a reasoning model from spending output tokens on thinking. Blank = omit.
ai.deepinfra.reasoningEffort=${DEEPINFRA_REASONING_EFFORT:none}

# false = send json_object instead of json_schema if the model rejects schema-constrained output.
ai.deepinfra.jsonSchemaEnabled=${DEEPINFRA_JSON_SCHEMA_ENABLED:true}

